# Position: top-left, top-right, bottom-left, bottom-right
position=top-left

# Text size
font_size=24

# FPS
fps
fps_limit=0

# Frame time graph
frame_timing=1

# GPU info
gpu_stats
gpu_temp
gpu_power
gpu_core_clock
gpu_mem_clock

# CPU info
cpu_stats
cpu_temp
cpu_power
cpu_mhz

# RAM / VRAM
ram
vram

# Battery (laptops)
battery

# Toggle key (default is F12)
toggle_hud=F12

# Background opacity (0.0 to 1.0)
background_alpha=0.0

# Color (hex, no #)
gpu_color=2E9762
cpu_color=2E97CB
