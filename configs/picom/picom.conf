backend = "glx";
vsync = true;

# Window animations. Tweak duration (seconds), scale, direction, or swap
# presets: appear/disappear, slide-in/slide-out, fly-in/fly-out, geometry-change.
animations = (
  # Opening a window: grow from 90% while fading in
  {
    triggers = [ "open" ];
    preset = "appear";
    scale = 0.9;
    duration = 0.2;
  },
  # Closing a window: shrink to 90% while fading out
  {
    triggers = [ "close" ];
    preset = "disappear";
    scale = 0.9;
    duration = 0.2;
  },
  # Workspace switching (i3 maps/unmaps windows): slide in/out
  {
    triggers = [ "show" ];
    preset = "appear";
    direction = "down";
    duration = 0.1;
  },
  {
    triggers = [ "hide" ];
    preset = "disappear";
    direction = "up";
    duration = 0.15;
  },
  # Moving, resizing, tiling reflow: smooth transition to new geometry
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.2;
  }
);
