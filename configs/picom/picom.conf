animations = true;
animation-stiffness = 900;
animation-dampening = 25;
animation-mass = 0.1;

animation-for-open-window = "zoom";      # options: zoom, fly-in, slide-up, slide-down
animation-for-unmap-window = "zoom";
animation-for-workspace-switch-in = "slide-right";
animation-for-workspace-switch-out = "slide-left";

# No fading for menus
fade-exclude = [
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'menu'",
  "window_type = 'combo'"
  "window_type = 'tooltip'"
];

# No animations for menus (if using picom-animations fork)
animation-exclude = [
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'menu'",
  "window_type = 'tooltip'"
];
