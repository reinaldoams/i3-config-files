# i3status configuration for the second HDMI bar (bar-hdmi-1-stats in ~/.config/i3/config).
# CPU, RAM, volume, date and time, as in ./config.

general {
	output_format = "i3bar"
        colors = true
        interval = 1
        separator = ""
        markup = "pango"            # Enables individual color wrapping

        # Fallback Dracula Colors
        color_good = "#50FA7B"      # Green
        color_degraded = "#F1FA8C"  # Yellow
        color_bad = "#FF5555"       # Red
}

order += "cpu_usage"
order += "memory"
order += "volume master"
order += "tztime dateAlternative"
order += "tztime time"

cpu_usage {
        # Foreground color
        format = "<span line_height='2' background='#ffffff' color='#000000'>   %usage </span>"
        #format = "CPU %usage"
        separator_block_width = 0
}

memory {
        format = "<span line_height='2' background='#333333' color='#ffffff'>   %used </span>"
        #format = "RAM %percentage_used"
        #format_degraded = "MEMORY < %available"
        separator_block_width = 0
}

volume master {
        #format = "VOL %volume"
        format = "<span line_height='2' background='#ffffff' color='#000000'>   %volume </span>"
        format_muted = "<span line_height='2' background='#bb0000' color='#000000'>   [MUTED] </span>"
        #format_muted = "🔇%volume"
        separator_block_width = 0
        # format_muted = "<span color='#FF5555'>🔇%volume</span>"
}

tztime dateAlternative {
        #format = "%Y.%m.%d"
        format = "<span line_height='2' background='#333333' color='#ffffff'> %d %b, %A </span>"
        separator_block_width = 0
}

tztime time {
        format = "<span background='#000000'><span font_size='90%' rise='9000' color='#091833'>x</span><span color='#ffffff'>%H:%M</span><span font_size='90%' rise='-6000' color='#091833'>x</span></span>"
        separator_block_width = 0
}
