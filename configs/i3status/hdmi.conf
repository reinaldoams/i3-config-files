# i3status configuration for the HDMI-only bar (see bar-hdmi in ~/.config/i3/config).
# No modules: this bar only carries the window title (added by i3status-title-on-bar).
# CPU, RAM, volume, date and time are on the stats bar (hdmi-top.conf).

general {
	output_format = "i3bar"
        colors = true
        interval = 1
        separator = ""
        markup = "pango"

        color_good = "#50FA7B"
        color_degraded = "#F1FA8C"
        color_bad = "#FF5555"
}

# i3status needs at least one module; i3bar hides blocks with empty text.
order += "tztime blank"

tztime blank {
        format = ""
}
